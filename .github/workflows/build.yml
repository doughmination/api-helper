name: Build APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.0.0. Leave blank to just build a debug APK."
        required: false
        type: string

jobs:
  # Every push/PR/manual run: build an unsigned debug APK, downloadable from the run's artifacts.
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: device-reporter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Builds a SIGNED release and publishes it as the latest Release.
  # Triggered by: "Run workflow" with a version filled in, OR pushing a v* tag.
  release:
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.version != '') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Version from the manual input, falling back to the tag name on a tag push.
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: chmod +x ./gradlew

      - name: Decode signing keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/device-reporter-${VERSION}.apk"

      - name: Publish GitHub Release (creates the tag, marked latest)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/device-reporter-${{ env.VERSION }}.apk
          name: Device Reporter ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          make_latest: true
          generate_release_notes: true
